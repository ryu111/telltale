[project]
name = "telltale"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []
# The plugin itself is TypeScript under plugins/telltale/hooks/ and ships with no Python.
# This file only pins the dev tooling for the ticket runner in scripts/.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-xdist>=3",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -q"
timeout = 300  # pytest-timeout：一支測試卡住不能卡死整條 check 與 xdist worker

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
extend-exclude = ["docs", "plugins", "node_modules"]

[tool.ruff.lint]
# KISS／SRP／YAGNI 能機械化的部分：複雜度、參數數量、分支數、死程式碼、未用參數。
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "C4", "C90", "PL", "ARG", "RET",
    "ERA", "TID", "PTH", "D", "ANN", "S", "A", "ISC", "T20", "TRY", "PERF",
    "PIE", "SLF", "DTZ", "EM", "G", "LOG", "RSE", "FURB",
]
ignore = [
    # 以下幾組內建「識別字只能是英文、標點只能是半形」的假設，跟繁體中文命名衝突。不要「修好」它們。
    "N",                            # pep8-naming：中文函式／類別名一律報錯
    "PLC2401", "PLC2403",           # 非 ASCII 識別字
    "RUF001", "RUF002", "RUF003",   # 把全形標點當可疑字元
    "D203", "D213", "D400", "D415", # 中文句號是「。」不是「.」
    "D403",                         # 首字大寫是英文慣例
    "D101", "D102", "D105", "D107", # 類別／方法逐一要 docstring 是噪音；模組與函式（D100、D103）仍要
    "ISC001",                       # 與 formatter 衝突
]

[tool.ruff.lint.mccabe]
max-complexity = 8                  # 超過門檻是拆函式，不是調高門檻

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 測試裡 assert 是介面本身；魔術數字是測資；docstring 由測試名稱承擔。
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "FBT001", "FBT002", "FBT003", "PLR2004", "ANN401", "SLF001", "S603", "S607", "PLR1714", "PLC0415"]

[tool.mypy]
strict = true
files = ["tests", "scripts"]
mypy_path = "scripts"
