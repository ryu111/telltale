# CI runs make check (the Python gate) plus the plugin gate (bun test + validate --strict)
# and make mutate (mutation tests). No LLM step: the eval layer stays out of CI on purpose.
name: check
on:
  pull_request:
  push:
    branches: [main]
# A new push on the same branch cancels the run still in flight: mutate is slow and nobody
# looks at a superseded run's result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g @anthropic-ai/claude-code
      - run: uv sync
      - run: make check
      - run: make mutate
