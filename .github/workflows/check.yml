# CI 只跑 make check（scripts/ 的 Python 閘）；plugin 本體的閘在 harness 票加進來。
name: check
on:
  pull_request:
  push:
    branches: [main]
# 同一分支新 push 就取消還在跑的舊 run：mutate 很吃時間，舊的跑完也沒人看。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make check

