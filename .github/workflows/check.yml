# CI 只擋前兩層（單元、流程）＋ mutation 門檻。評測層（真 LLM）不進 CI。
name: check
on:
  pull_request:
  push:
    branches: [main]
# 同一分支新 push 就取消還在跑的舊 run：mutate 很吃時間，舊的跑完也沒人看。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make check
      - run: make mutate
